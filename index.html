<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verse</title>
<style>
:root{--bg:#14100d;--surface:#1c1713;--line:#34291f;--text:#f0e6d6;--muted:#a39684;--accent:#e0a458;--ink:#1a130b;--serif:"Lora",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .5em}h1{font-size:34px}h2{font-size:22px}h3{font-size:21px}
p{margin:0 0 1em}button{font:inherit;color:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 4%;background:rgba(20,16,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-style:italic;font-weight:600;font-size:27px;letter-spacing:-.5px}.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;flex-wrap:wrap}.nav button{background:none;border:0;padding:8px 10px;color:var(--muted);font-size:15px;border-bottom:2px solid transparent}.nav button:hover{color:var(--text);border-bottom-color:var(--accent)}
.container{max-width:1040px;margin:0 auto;padding:34px 4%}.reader{max-width:660px;margin:0 auto}
.hero{padding:10px 0 28px}.hero h1{font-size:42px;max-width:14ch;margin-bottom:.3em}.hero p{color:var(--muted);font-size:18px}
.eyebrow{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.poem-card{border-left:3px solid var(--accent);border-radius:4px 12px 12px 4px}
.poem-card h3{margin-bottom:6px}
.poem-preview{font-family:var(--serif);font-style:italic;color:#d8cbb6;line-height:1.7;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.poem-body{font-family:var(--serif);font-size:20px;line-height:1.95;white-space:pre-wrap;margin:26px 0 34px}
.meta{color:var(--muted);font-size:13px}.muted{color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}.right{margin-left:auto}
.primary{background:var(--accent);color:var(--ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600}.primary:disabled{opacity:.5}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 16px}
.danger{background:transparent;border:1px solid #6b3126;color:#e58a76;border-radius:8px;padding:10px 16px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{position:relative;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:7px 13px;font-size:14px}
.chip.on,.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}.chip input{position:absolute;opacity:0;pointer-events:none}
.field{margin:0 0 18px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px;letter-spacing:.04em}
input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.field input,.field textarea{width:100%}textarea{resize:vertical;line-height:1.6}select{max-width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.cmt{border-bottom:1px solid var(--line);padding:14px 0}.cmt p{margin:4px 0 0;color:#d8cbb6;line-height:1.6}
.empty{border:1px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.avatar{width:58px;height:58px;border-radius:14px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font:600 26px var(--serif)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:13px}.stat b{display:block;color:var(--text);font:600 28px var(--serif)}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px}
.authbox .brand{margin-bottom:18px}.authbox h1{font-size:30px}.switch{margin-top:18px;font-size:14px;color:var(--muted)}
.foot{text-align:center;padding:30px 0 40px;color:var(--muted);font-size:13px}
.legal h2{margin-top:28px}.legal p,.legal li{color:#d8cbb6;line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modalbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:420px;width:100%}
@media(max-width:600px){h1{font-size:28px}.hero h1{font-size:34px}.nav button{padding:7px 8px;font-size:14px}.container{padding-top:24px}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&display=swap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL="https://gwmsehlstohdedmcorbl.supabase.co",SUPABASE_KEY="sb_publishable_f-tWxDnLdezbvY7PzYOmGg_1mZ5wLW9";
const OWNER="PASTE_YOUR_NAME_OR_BUSINESS",CONTACT="PASTE_CONTACT_EMAIL",UPDATED="7 October 2026";
const CATS=["Love","Heartbreak","Life","Grief","Hope","Nature","Faith","Anger","Identity","Friendship","Family","Humor"];
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
let sb,me=null,names={},following=new Set(),tab="discover",filter="All",pending="",cool=0;
function nm(id){let u=names[id];return u?(u.nick||u.name):"Poet"}
async function loadNames(ids){let need=[...new Set(ids)].filter(i=>i&&!names[i]);if(!need.length)return;let {data}=await sb.from("profiles").select("id,name,nick").in("id",need);(data||[]).forEach(u=>names[u.id]=u)}
async function loadFollowing(){let {data}=await sb.from("follows").select("following_id").eq("follower_id",me.id);following=new Set((data||[]).map(r=>r.following_id))}
function layout(c){return `<div class="shell"><header class="topbar"><div class="brand">verse<span>.</span></div><nav class="nav"><button onclick="home()">Home</button><button onclick="searchView()">Search</button><button onclick="profileView()">Profile</button>${me&&me.role!=="user"?`<button onclick="staffView()">Staff</button>`:""}<button onclick="logout()">Log out</button></nav></header>${c}${footer()}</div>`}
function footer(){return `<div class="foot"><button class="link" onclick="legalView('terms')">Terms</button> · <button class="link" onclick="legalView('privacy')">Privacy</button> · <button class="link" onclick="legalView('help')">Need support?</button></div>`}
function show(c){$("app").innerHTML=layout(c)}
function fail(e){show(`<main class="container"><div class="empty">Something went wrong: ${esc(e.message||e)}</div></main>`)}
function say(t){let m=$("msg");if(m)m.textContent=t}
function busy(on){let b=$("go");if(b)b.disabled=on}

/* ---------- LOGIN: email code every time ---------- */
async function boot(){
 if(SUPABASE_URL.includes("PASTE")){$("app").innerHTML=`<div class="auth"><div class="authbox"><div class="brand">verse<span>.</span></div><h1>Almost there</h1><p class="muted">Paste your Supabase project URL and anon key at the top of this file, then reload.</p></div></div>`;return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){me=null;loginView()}});
 let {data}=await sb.auth.getSession();
 if(data.session)await enter();else loginView()
}
async function enter(){
 let {data:{user}}=await sb.auth.getUser();if(!user)return loginView();
 let {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(error)return fail(error);
 me=data;await loadFollowing();home()
}
function loginView(step="email"){
 $("app").innerHTML=`<div class="auth"><div class="authbox"><div class="brand">verse<span>.</span></div><h1>${step==="email"?"Come on in":"Enter your code"}</h1><p class="muted">${step==="email"?"Pop in your email and we'll send you a code. No password to remember.":"We sent a code to "+esc(pending)+"."}</p>
<form onsubmit="event.preventDefault();${step==="email"?"sendCode()":"checkCode()"}">
${step==="email"?`<div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Your name (new accounts only)</label><input id="name" maxlength="40"></div>`:`<div class="field"><label>Code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required></div>`}
<button class="primary" style="width:100%" id="go">${step==="email"?"Send code":"Log in"}</button></form>
${step==="code"?`<div class="switch"><button class="link" onclick="sendCode(pending)">Send a new code</button> · <button class="link" onclick="loginView()">Use a different email</button></div>`:""}
<p class="meta" style="margin-top:22px" id="msg"></p></div></div>`
}
async function sendCode(again){
 let e=again||$("email").value.trim().toLowerCase();if(!e)return;
 if(!agreed())return askTerms(()=>sendCode(e));
 if(Date.now()<cool)return say("Wait a minute before asking for another code.");
 let n=$("name")?$("name").value.trim():"";
 busy(true);
 let {error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:true,data:{name:n||"Poet"}}});
 busy(false);
 if(error)return say(error.message);
 cool=Date.now()+60000;pending=e;loginView("code")
}
async function checkCode(){
 busy(true);
 let {error}=await sb.auth.verifyOtp({email:pending,token:$("code").value.trim(),type:"email"});
 busy(false);
 if(error)return say("That code didn't work. Check it, or request a new one.");
 await enter()
}
async function logout(){await sb.auth.signOut()}

/* ---------- HOME ---------- */
function card(p){return `<article class="card poem-card"><div class="meta">${esc(nm(p.author_id))} · ${p.views} views</div><h3>${esc(p.title)}</h3><div><span class="tag">${esc(p.category||"")}</span> <span class="tag">${esc(p.rating)}</span></div><div class="poem-preview" style="margin-top:12px">${esc(p.body.slice(0,180))}${p.body.length>180?"…":""}</div><div class="actions"><button class="primary" onclick="readPoem('${p.id}')">Read poem</button><span class="meta">${p.likes} likes · ${p.comment_count} comments</span></div></article>`}
async function home(){
 show(`<main class="container"><p class="muted">Loading…</p></main>`);
 let q=sb.from("poem_feed").select("*").eq("status","published").order("published_at",{ascending:false}).limit(60);
 if(filter!=="All")q=q.eq("category",filter);
 if(tab==="following"){let ids=[...following];q=ids.length?q.in("author_id",ids):null}
 let list=[];
 if(q){let {data,error}=await q;if(error)return fail(error);list=data}
 await loadNames(list.map(p=>p.author_id));
 let tabs=[["discover","Discover"],["following","Following"]].map(([k,l])=>`<button class="chip ${tab===k?"on":""}" onclick="tab='${k}';home()">${l}</button>`).join("");
 let chips=["All",...CATS].map(c=>`<button class="chip ${c===filter?"on":""}" onclick="filter='${c}';home()">${c}</button>`).join("");
 show(`<main class="container"><section class="hero"><h1>Say it like you mean it.</h1><p>Short poems from real people.</p><button class="primary" onclick="publishView()">Write something</button></section><div class="chips">${tabs}</div><div class="field"><input placeholder="Search poems, lines or poets" readonly onfocus="searchView()"></div><div class="chips">${chips}</div><div class="grid">${list.length?list.map(card).join(""):`<div class="empty">${tab==="following"?"Follow poets to see their poems here.":"No poems yet. Be the first."}</div>`}</div></main>`)
}

/* ---------- READ ---------- */
function followBtn(uid,pid){if(uid===me.id)return "";let f=following.has(uid);return `<button class="${f?"ghost":"primary"}" onclick="toggleFollow('${uid}','${pid}')">${f?"Following":"Follow"}</button>`}
async function toggleFollow(uid,pid){
 let {error}=following.has(uid)?await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",uid):await sb.from("follows").insert({follower_id:me.id,following_id:uid});
 if(error)return alert(error.message);
 await loadFollowing();pid?readPoem(pid):profileView(uid)
}
async function readPoem(id){
 let {data:p,error}=await sb.from("poem_feed").select("*").eq("id",id).single();if(error)return fail(error);
 if(p.rating==="16+"&&p.author_id!==me.id&&!me.confirmed_16){
  if(!confirm("This poem is rated 16+. Are you 16 or older?"))return;
  await sb.from("profiles").update({confirmed_16:true}).eq("id",me.id);me.confirmed_16=true}
 sb.rpc("record_view",{p:id});
 let [c,l]=await Promise.all([sb.from("comments").select("*").eq("poem_id",id).order("created_at"),sb.from("poem_likes").select("user_id").eq("poem_id",id).eq("user_id",me.id)]);
 let cm=c.data||[],liked=(l.data||[]).length>0,own=p.author_id===me.id;
 await loadNames([p.author_id,...cm.map(x=>x.author_id)]);
 let cmh=cm.map(x=>`<div class="cmt"><b>${esc(nm(x.author_id))}</b>${x.author_id===me.id||own?` <button class="link" onclick="delComment('${x.id}','${id}')">Delete</button>`:""}${x.author_id!==me.id?` <button class="link" onclick="reportComment('${x.id}')">Report</button>`:""}<p>${esc(x.body)}</p></div>`).join("")||`<p class="muted">No comments yet. Be the first.</p>`;
 show(`<main class="container"><div class="reader"><button class="ghost" onclick="home()">← Back</button><div class="actions" style="margin-top:35px"><button class="link" onclick="profileView('${p.author_id}')">${esc(nm(p.author_id))}</button><span class="meta">· ${p.views} views</span><span class="tag">${esc(p.category||"")}</span><span class="tag">${esc(p.rating)}</span><span class="right">${followBtn(p.author_id,id)}</span></div><h1>${esc(p.title)}</h1><div class="poem-body">${fmt(p.body)}</div><div class="actions"><button class="primary" onclick="toggleLike('${id}',${liked})">${liked?"♥ Liked":"♡ Like"} (${p.likes})</button>${own?`<button class="ghost" onclick="editPoem('${id}')">Edit</button><button class="danger" onclick="delPoem('${id}')">Delete</button>`:`<select id="rrs" class="ghost"><option>Spam</option><option>Abusive</option><option>Copied</option><option>Wrong rating</option></select><button class="link" onclick="reportPoem('${id}')">Report</button>`}</div><h2 style="margin-top:40px">Comments (${cm.length})</h2>${cmh}<div class="field"><textarea id="ctext" rows="3" placeholder="Share what this poem made you feel"></textarea></div><button class="primary" onclick="addComment('${id}')">Post comment</button></div></main>`)
}
async function toggleLike(id,liked){
 let {error}=liked?await sb.from("poem_likes").delete().eq("poem_id",id).eq("user_id",me.id):await sb.from("poem_likes").insert({poem_id:id,user_id:me.id});
 if(error)return alert(error.message);readPoem(id)
}
async function addComment(id){
 let t=$("ctext").value.trim();if(!t)return alert("Write a comment first.");
 let {error}=await sb.from("comments").insert({poem_id:id,author_id:me.id,body:t});
 if(error)return alert(error.message);readPoem(id)
}
async function delComment(cid,pid){let {error}=await sb.from("comments").delete().eq("id",cid);if(error)return alert(error.message);readPoem(pid)}
async function reportPoem(id){
 let {error}=await sb.rpc("submit_report",{p_poem:id,p_reason:$("rrs").value});
 alert(error?error.message:"Thanks. A reviewer will look at it. Your report is anonymous and the poem stays up until then.")
}

/* ---------- PUBLISH ---------- */
let editId=null;
async function editPoem(id){let {data:p,error}=await sb.from("poems").select("*").eq("id",id).single();if(error)return fail(error);publishView(p)}
function publishView(p){
 editId=p?p.id:null;
 show(`<main class="container"><div class="reader"><button class="ghost" onclick="${p?`readPoem('${p.id}')`:"home()"}">← Back</button><h1>${p?"Edit poem":"Publish"}</h1><p class="muted">Poems need at least 35 words and must be original${p?". Edits are checked by the same rules.":". You can publish 2 a day and 10 a month."} Use *italics* and **bold**.</p><form onsubmit="event.preventDefault();createPoem()"><div class="field"><label>What is this poem about? Pick a category</label><div class="chips" style="margin:0">${CATS.map(c=>`<label class="chip"><input type="radio" name="pcat" value="${c}" required ${p&&p.category===c?"checked":""}>${c}</label>`).join("")}</div></div><div class="field"><label>Who is this poem for? Pick a rating</label><div class="chips" style="margin:0">${["Family","16+"].map(c=>`<label class="chip"><input type="radio" name="prate" value="${c}" required ${p&&p.rating===c?"checked":""}>${c}</label>`).join("")}</div></div><div class="field"><label>Title</label><input id="ptitle" required maxlength="120" value="${esc(p?p.title:"")}"></div><div class="field"><label>Poem</label><textarea id="pbody" rows="12" required>${esc(p?p.body:"")}</textarea></div><button class="primary" id="go">${p?"Save changes":"Publish poem"}</button></form></div></main>`)
}
async function createPoem(){
 busy(true);
 let row={title:$("ptitle").value.trim(),body:$("pbody").value.trim(),category:document.querySelector("input[name=pcat]:checked").value,rating:document.querySelector("input[name=prate]:checked").value};
 let {error}=editId?await sb.from("poems").update(row).eq("id",editId):await sb.from("poems").insert({...row,author_id:me.id,status:"published"});
 busy(false);
 if(error)return alert(error.message);
 let id=editId;editId=null;filter="All";tab="discover";id?readPoem(id):home()
}
async function delPoem(id){
 if(!confirm("Delete this poem? This can't be undone."))return;
 let {error}=await sb.from("poems").delete().eq("id",id);
 if(error)return alert(error.message);home()
}

/* ---------- SEARCH ---------- */
async function searchView(t){
 let q=(t||"").trim(),s=q.replace(/["\\%,]/g,""),P=[],L=[];
 if(s){
  let [a,b]=await Promise.all([
   sb.from("poem_feed").select("*").eq("status","published").or(`title.ilike."%${s}%",body.ilike."%${s}%"`).limit(30),
   sb.from("profiles").select("id,name,nick,bio").or(`name.ilike."%${s}%",nick.ilike."%${s}%"`).limit(20)]);
  L=a.data||[];P=b.data||[];await loadNames(L.map(p=>p.author_id))}
 let low=s.toLowerCase();
 let pm=L.map(p=>{let l=p.body.split("\n").find(x=>x.toLowerCase().includes(low));return `<div>${l?`<p class="muted" style="margin:0 0 6px">Matched: “${esc(l.trim())}”</p>`:""}${card(p)}</div>`}).join("");
 let po=P.map(u=>`<div class="cmt"><button class="link" onclick="profileView('${u.id}')"><b>${esc(u.nick||u.name)}</b></button> <span class="muted">${esc(u.bio||"")}</span></div>`).join("");
 show(`<main class="container"><form onsubmit="event.preventDefault();searchView($('sq').value)"><div class="field"><input id="sq" placeholder="Search a line, poem, poet or category" value="${esc(q)}"></div><button class="primary">Search</button></form>${s?`<h2 style="margin-top:30px">Poets (${P.length})</h2>${po||`<p class="muted">No poets found.</p>`}<h2 style="margin-top:30px">Poems (${L.length})</h2><div class="grid">${pm||`<div class="empt
